# Template for ansible/inventory/group_vars/server/secrets.sops.yaml — `veyqctl init` fills it and writes
# only the SOPS-encrypted result. Read a value with
#   sops decrypt --extract '["admin_password"]' ansible/inventory/group_vars/server/secrets.sops.yaml
# The admin user's sudo password (`veyqctl init` asks for it, Enter generates one; keep it in your password manager),
# and the fixed salt that keeps its hash stable.
admin_password: __ADMIN_PASSWORD__
admin_password_salt: __RANDOM_16__
# The private half of the repository's read-only GitHub deploy key; Ansible hands it to Argo CD.
argocd_repo_ssh_private_key: __DEPLOY_KEY__
