# Run every ansible command from this directory (ansible/), so this file is the one read.
[defaults]
inventory = inventory/hosts.yml
roles_path = roles
# Collections pinned in requirements.yml, installed here (gitignored) — never the ones a system Ansible bundles.
collections_path = collections
# group_vars/*/*.sops.yaml are decrypted on the fly by community.sops, with the owner's age key from the
# environment (SOPS_AGE_KEY_CMD, SOPS_AGE_KEY_FILE or SOPS_AGE_KEY). Nothing decrypted is written to disk.
vars_plugins_enabled = host_group_vars,community.sops.sops
interpreter_python = auto_silent
callback_result_format = yaml
retry_files_enabled = false
host_key_checking = true
nocows = true

[ssh_connection]
pipelining = true
