- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: [unattended-upgrades, needrestart]
    state: present

- name: Switch the daily run on
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Set the clean-up and reboot policy
  ansible.builtin.template:
    src: 52veyq-server.j2
    dest: /etc/apt/apt.conf.d/52veyq-server
    owner: root
    group: root
    mode: "0644"
