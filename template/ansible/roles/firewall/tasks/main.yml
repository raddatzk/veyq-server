- name: Install nftables
  ansible.builtin.apt:
    name: nftables
    state: present

- name: Write the host firewall
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0755"
    validate: /usr/sbin/nft -c -f %s
  notify: Reload nftables

- name: Load the firewall at boot
  ansible.builtin.systemd_service:
    name: nftables
    enabled: true
    state: started
