# Runs inside server.yml, which connects as the admin user and has already proven that login works (pre_task), so
# switching root and password logins off here cannot lock the owner out.
- name: Write the sshd hardening drop-in
  ansible.builtin.template:
    src: 01-veyq-server.conf.j2
    dest: /etc/ssh/sshd_config.d/01-veyq-server.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd

- name: Check the effective sshd configuration
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false
  check_mode: false
