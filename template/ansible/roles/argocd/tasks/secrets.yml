# The two Secrets Git does not hold, built on the controller from the owner's age key and the SOPS-decrypted
# deploy key: argocd_cluster_secrets, a list of manifests. Needs the age private key: the owner's Mac.
- name: Read the age private key on the controller
  ansible.builtin.shell: |
    set -euo pipefail
    if [ -n "${SOPS_AGE_KEY_CMD:-}" ]; then eval "$SOPS_AGE_KEY_CMD"
    elif [ -n "${SOPS_AGE_KEY_FILE:-}" ]; then cat "$SOPS_AGE_KEY_FILE"
    elif [ -n "${SOPS_AGE_KEY:-}" ]; then printf '%s\n' "$SOPS_AGE_KEY"
    else echo "set SOPS_AGE_KEY_CMD, SOPS_AGE_KEY_FILE or SOPS_AGE_KEY (README)" >&2; exit 1
    fi | grep -E '^AGE-SECRET-KEY-1[0-9A-Z]+$'
  args:
    executable: /bin/bash
  register: argocd_age_key
  delegate_to: localhost
  become: false
  changed_when: false
  check_mode: false
  no_log: true

- name: Require exactly one age private key
  ansible.builtin.assert:
    that: argocd_age_key.stdout_lines | length == 1
    fail_msg: the age key source must hold exactly one AGE-SECRET-KEY line
  no_log: true

- name: Derive its public key
  ansible.builtin.command: age-keygen -y
  args:
    stdin: "{{ argocd_age_key.stdout }}"
  register: argocd_age_public
  delegate_to: localhost
  become: false
  changed_when: false
  check_mode: false

- name: Require it to be the recipient .sops.yaml encrypts to
  ansible.builtin.assert:
    that: argocd_age_public.stdout in lookup('ansible.builtin.file', argocd_repo_root ~ '/.sops.yaml')
    fail_msg: >-
      The age key in the environment ({{ argocd_age_public.stdout }}) is not the recipient in .sops.yaml; the
      cluster could not decrypt this repository's secrets with it.

- name: Build the two cluster Secrets
  ansible.builtin.set_fact:
    argocd_cluster_secrets:
      - apiVersion: v1
        kind: Secret
        metadata:
          name: sops-age
          namespace: argocd
        type: Opaque
        stringData:
          keys.txt: "{{ argocd_age_key.stdout }}\n"
      - apiVersion: v1
        kind: Secret
        metadata:
          name: repo-server
          namespace: argocd
          labels:
            argocd.argoproj.io/secret-type: repository
        type: Opaque
        stringData:
          type: git
          url: "{{ argocd_repo_url }}"
          sshPrivateKey: "{{ argocd_repo_ssh_private_key }}"
  no_log: true
