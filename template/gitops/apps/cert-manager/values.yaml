# cert-manager v1.21.3 chart values. Images by digest (resolved 2026-11-05 for v1.21.3).
crds:
  enabled: true
  # Uninstalling the chart keeps the CRDs, and with them every Certificate.
  keep: true

image:
  # renovate: datasource=docker depName=quay.io/jetstack/cert-manager-controller version=v1.21.3
  digest: sha256:9f4f96a33c7774cef24466fcd85031997531a03a8d117f151126baa8d1290dcc
webhook:
  image:
    # renovate: datasource=docker depName=quay.io/jetstack/cert-manager-webhook version=v1.21.3
    digest: sha256:055ac8e9de6a0ba6763794838fe38944acc650f68ebe1b01dd8be079e580f458
cainjector:
  image:
    # renovate: datasource=docker depName=quay.io/jetstack/cert-manager-cainjector version=v1.21.3
    digest: sha256:083d0e906f8eb44e255fe4ff817ae54e49f9ed82e22f1011bb4e9e4f4b8a641f
acmesolver:
  image:
    # renovate: datasource=docker depName=quay.io/jetstack/cert-manager-acmesolver version=v1.21.3
    digest: sha256:c8c1225bb2fe8ab37a330b77f0d8c2ee6a41210fcb54fc07ca606ab9a022b8b7
# A Helm post-install hook that only checks the API is up; Argo CD's health checks already do.
startupapicheck:
  enabled: false

# What veyq's chart requires (values.yaml, gateway.tls.acme): Gateway API support AND ListenerSet support (alpha).
config:
  apiVersion: controller.config.cert-manager.io/v1alpha1
  kind: ControllerConfiguration
  gatewayAPI:
    enabled: true
    enableListenerSet: true
  featureGates:
    ListenerSets: true
  # A Certificate's Secret goes with it: a withdrawn tenant domain leaves no orphaned TLS Secret (veyq's
  # networking docs name that residue).
  enableCertificateOwnerRef: true
