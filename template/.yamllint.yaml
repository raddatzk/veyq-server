extends: default

ignore: |
  ansible/collections/
  .render/
  # Written by sops (its own indentation, encrypted comments); never edited by hand.
  *.sops.yaml

rules:
  line-length:
    max: 140
    level: warning
  document-start: disable
  truthy:
    allowed-values: ["true", "false"]
    check-keys: false
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  indentation:
    spaces: 2
    indent-sequences: consistent
  # Ansible-lint's production profile expects these settings.
  braces:
    max-spaces-inside: 1
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
